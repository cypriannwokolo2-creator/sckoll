services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://sckoll:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sckoll
      REDIS_URL: redis://redis:6379
      PORT: 8110
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8110:8110
    networks:
      - internal
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.sckoll-api.entrypoints=websecure
      - traefik.http.routers.sckoll-api.rule=Host(`api.sckoll.com`)
      - traefik.http.routers.sckoll-api.service=sckoll-api
      - traefik.http.routers.sckoll-api.tls.certresolver=letsencrypt
      - traefik.http.services.sckoll-api.loadbalancer.server.port=8110

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sckoll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sckoll
    volumes:
      - sckoll-pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5435:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sckoll -d sckoll"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:6381:6379
    networks:
      - internal

volumes:
  sckoll-pgdata:

networks:
  internal:
  edge:
    external: true

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://sckoll:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sckoll
      REDIS_URL: redis://redis:6379
      PORT: 8110
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8110:8110
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8110/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - internal
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.sckoll-api.entrypoints=websecure
      - traefik.http.routers.sckoll-api.rule=Host(`api.sckoll.com`)
      - traefik.http.routers.sckoll-api.middlewares=sec-headers@file
      - traefik.http.routers.sckoll-api.service=sckoll-api
      - traefik.http.routers.sckoll-api.tls.certresolver=letsencrypt
      - traefik.http.services.sckoll-api.loadbalancer.server.port=8110

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sckoll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sckoll
    volumes:
      - sckoll-pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5435:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sckoll -d sckoll"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:6381:6379
    networks:
      - internal

  # Self-hosted error tracking (Sentry-compatible). Runs as ONE all-in-one
  # process (v6): serves the UI/API, consumes the task queue, schedules tasks.
  # Host-local only (127.0.0.1:8120) — reach it via SSH tunnel; error data is
  # sensitive, so it is deliberately not on the public Traefik router. When a
  # glitchtip.sckoll.com DNS record exists, add the standard Traefik labels and
  # an `edge` network attachment to publish it.
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    # Migrations explicitly before serve (init alone does not migrate v6).
    command: sh -c "python manage.py migrate && ./bin/start.sh"
    env_file:
      - ./.env.glitchtip
    environment:
      DATABASE_URL: postgres://sckoll:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8120:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    networks:
      - internal

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    networks:
      - internal

volumes:
  sckoll-pgdata:

networks:
  internal:
  edge:
    external: true
